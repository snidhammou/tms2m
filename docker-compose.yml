services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tms
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: tms
    volumes:
      - pgdata:/var/lib/postgresql/data

  tms-server:
    build: ./backend
    depends_on:
      - postgres
    ports:
      - "8095:8095"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/tms
      DB_USER: tms
      DB_PASSWORD: tms
      TMS_ADMIN_PASSWORD: change-me-admin
      TMS_ENROLLMENT_KEY: change-me-enroll
      TMS_APK_DIR: /app/data/apks
    volumes:
      - apks:/app/data

volumes:
  pgdata:
  apks:
